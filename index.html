<!DOCTYPE html>
<html lang="ru" data-theme="flat-dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rhythm Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* === ФЛЭТ-ДИЗАЙН ТЕМЫ (FLAT MINIMALISM) === */
        [data-theme="flat-dark"] {
            --bg-body: #0f172a;
            --panel-bg: #1e293b;
            --panel-border: #334155;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #06b6d4;
            --canvas-bg: #0f172a;
            --lane-line: #1e293b;
            --hitline-color: #3b82f6;
            --card-bg: #334155;
            --card-border: #475569;
            --measure-line: #f59e0b;
        }

        [data-theme="flat-light"] {
            --bg-body: #f1f5f9;
            --panel-bg: #ffffff;
            --panel-border: #cbd5e1;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --accent: #0284c7;
            --canvas-bg: #ffffff;
            --lane-line: #e2e8f0;
            --hitline-color: #2563eb;
            --card-bg: #f8fafc;
            --card-border: #cbd5e1;
            --measure-line: #d97706;
        }

        [data-theme="flat-emerald"] {
            --bg-body: #064e3b;
            --panel-bg: #065f46;
            --panel-border: #047857;
            --text-main: #ecfdf5;
            --text-sub: #a7f3d0;
            --primary: #10b981;
            --primary-hover: #059669;
            --accent: #34d399;
            --canvas-bg: #064e3b;
            --lane-line: #065f46;
            --hitline-color: #10b981;
            --card-bg: #047857;
            --card-border: #059669;
            --measure-line: #f59e0b;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-body);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* === ГЛАВНАЯ ПАНЕЛЬ ИНТЕРФЕЙСА === */
        #ui-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: var(--panel-bg);
            padding: 24px;
            border-radius: 16px;
            border: 2px solid var(--panel-border);
            z-index: 10;
            width: 440px;
            max-width: 92vw;
            max-height: 90vh;
            overflow-y: auto;
        }

        .brand-title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        /* ТАБЫ */
        .mode-tabs {
            display: flex;
            background: var(--bg-body);
            padding: 4px;
            border-radius: 12px;
            gap: 4px;
            border: 1px solid var(--panel-border);
        }

        .tab-btn {
            flex: 1;
            padding: 10px 4px;
            background: transparent;
            border: none;
            color: var(--text-sub);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8rem;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #ffffff;
        }

        .tab-content {
            display: none;
            flex-direction: column;
            gap: 14px;
        }

        .tab-content.active { display: flex; }

        /* КАРТОЧКИ УРОВНЕЙ */
        .official-levels { display: flex; flex-direction: column; gap: 10px; }

        .level-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 12px 16px;
            border-radius: 12px;
        }

        .level-info h4 { font-size: 0.95rem; font-weight: 700; color: var(--text-main); }
        .level-badges { display: flex; gap: 6px; margin-top: 4px; }

        .badge {
            font-size: 0.68rem;
            font-weight: 800;
            padding: 3px 6px;
            border-radius: 6px;
            text-transform: uppercase;
        }

        .badge-easy { background: #10b981; color: #ffffff; }
        .badge-medium { background: #f59e0b; color: #ffffff; }
        .badge-hard { background: #ef4444; color: #ffffff; }
        .badge-info { background: var(--panel-border); color: var(--text-main); }

        /* ИНПУТЫ И КНОПКИ */
        .input-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.78rem; color: var(--text-sub); font-weight: 700; }

        input[type="file"], input[type="text"], input[type="number"], select {
            font-size: 0.85rem;
            color: var(--text-main);
            background: var(--bg-body);
            border: 1px solid var(--panel-border);
            padding: 10px;
            border-radius: 8px;
            outline: none;
            font-family: inherit;
        }

        input:focus, select:focus { border-color: var(--primary); }

        .btn {
            background: var(--primary);
            border: none;
            color: white;
            padding: 12px;
            font-size: 0.9rem;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.15s ease;
            text-align: center;
        }

        .btn:hover { background: var(--primary-hover); }
        .btn:active { transform: scale(0.98); }
        .btn-small { padding: 8px 14px; font-size: 0.8rem; border-radius: 8px; }

        /* ПАНЕЛЬ РЕДАКТОРА */
        #editor-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 10px;
            background: var(--panel-bg);
            padding: 10px 16px;
            border-radius: 12px;
            border: 2px solid var(--panel-border);
            z-index: 20;
        }

        .btn-rec { background: #ef4444; }
        .btn-rec.recording { background: #dc2626; border: 2px solid #ffffff; }

        #exit-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 15;
            display: none;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8rem;
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 16px;
            left: 16px;
            pointer-events: none;
            z-index: 15;
            display: none;
            color: var(--text-main);
        }

        .score-text { font-size: 1.6rem; font-weight: 900; }
        .combo-text { font-size: 0.9rem; color: var(--accent); font-weight: 800; }

        /* ОВЕРЛЕЙ ОБРАТНОГО ОТСЧЕТА (3-2-1) */
        #countdown-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
        }

        #countdown-number {
            font-size: 6rem;
            font-weight: 900;
            color: var(--primary);
        }

        #countdown-sub {
            font-size: 1rem;
            font-weight: 700;
            color: #94a3b8;
            margin-top: 10px;
        }

        /* ИГРОВОЙ КОНТЕЙНЕР (ОПТИМИЗИРОВАН) */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background: var(--canvas-bg);
            border-left: 2px solid var(--panel-border);
            border-right: 2px solid var(--panel-border);
            overflow: hidden;
            z-index: 1;
        }

        canvas { width: 100%; height: 100%; display: block; }

        #hit-feedback {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            font-weight: 900;
            pointer-events: none;
            opacity: 0;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <audio id="audio-player"></audio>
    <button id="exit-btn">← Меню</button>

    <!-- Оверлей обратного отсчета -->
    <div id="countdown-overlay">
        <div id="countdown-number">3</div>
        <div id="countdown-sub">Приготовьте руки! (Z X C V)</div>
    </div>

    <!-- Главное Меню -->
    <div id="ui-panel">
        <div class="brand-title">Rhythm Studio</div>
        
        <div class="mode-tabs">
            <button class="tab-btn active" onclick="switchTab('official')">GitHub Треки</button>
            <button class="tab-btn" onclick="switchTab('custom')">Пакет (.rs)</button>
            <button class="tab-btn" onclick="switchTab('editor')">Редактор</button>
            <button class="tab-btn" onclick="switchTab('style')">Стиль</button>
        </div>

        <!-- Таб 1: GitHub Треки -->
        <div id="tab-official" class="tab-content active">
            <div class="official-levels" id="official-levels-list"></div>
        </div>

        <!-- Таб 2: Загрузка готового уровня .rs -->
        <div id="tab-custom" class="tab-content">
            <div class="input-group">
                <label>Выберите единый файл уровня (.rs):</label>
                <input type="file" id="play-package-input" accept=".rs,.json">
            </div>
            <button class="btn" id="start-custom-play-btn">Запустить пакет уровня</button>
        </div>

        <!-- Таб 3: Редактор -->
        <div id="tab-editor" class="tab-content">
            <div class="input-group">
                <label>Название трека:</label>
                <input type="text" id="edit-title" value="My Track">
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="input-group" style="flex: 1;">
                    <label>Темп (BPM):</label>
                    <input type="number" id="edit-bpm" value="120" min="40" max="300">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>Размер такта:</label>
                    <select id="edit-timesig">
                        <option value="4/4">4/4</option>
                        <option value="3/4">3/4</option>
                    </select>
                </div>
            </div>
            <div class="input-group">
                <label>Сетка квантования (привязка нот):</label>
                <select id="edit-quantize">
                    <option value="4">1/4 (Четверти)</option>
                    <option value="8" selected>1/8 (Восьмые)</option>
                    <option value="16">1/16 (Шестнадцатые)</option>
                </select>
            </div>
            <div class="input-group">
                <label>Музыка (.mp3, .wav):</label>
                <input type="file" id="edit-audio-input" accept="audio/*">
            </div>

            <button class="btn" id="start-editor-btn" style="margin-top: 6px;">Открыть студию записи</button>
        </div>

        <!-- Таб 4: Стили -->
        <div id="tab-style" class="tab-content">
            <div class="input-group">
                <label>Тема оформления:</label>
                <select id="theme-select">
                    <option value="flat-dark">Flat Dark (Тёмный плоский)</option>
                    <option value="flat-light">Flat Light (Светлый плоский)</option>
                    <option value="flat-emerald">Flat Emerald (Изумрудный)</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Панель управления записью -->
    <div id="editor-controls">
        <button class="btn btn-small btn-rec" id="rec-btn">Запись / Пауза</button>
        <button class="btn btn-small" id="clear-btn" style="background: #64748b;">Очистить</button>
        <button class="btn btn-small" id="export-btn" style="background: #10b981;">Скачать пакет .RS</button>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div class="score-text"><span id="hud-title">Счет:</span> <span id="score-val">0</span></div>
        <div class="combo-text" id="combo-box">Комбо: <span id="combo-val">0</span>x</div>
    </div>

    <div id="game-container">
        <div id="hit-feedback">PERFECT</div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Выключен альфа-канал задника для максимального FPS
        const hitFeedback = document.getElementById('hit-feedback');
        const audioPlayer = document.getElementById('audio-player');

        let currentMode = 'official'; 
        let isRunning = false;

        let score = 0;
        let combo = 0;
        let currentBpm = 120;
        let currentTimeSig = '4/4';

        let currentTheme = 'flat-dark';

        const THEMES_CONFIG = {
            'flat-dark': { laneColors: ['#3b82f6', '#06b6d4', '#ec4899', '#8b5cf6'], hitLine: '#3b82f6', bg: '#0f172a' },
            'flat-light': { laneColors: ['#2563eb', '#0284c7', '#db2777', '#7c3aed'], hitLine: '#2563eb', bg: '#ffffff' },
            'flat-emerald': { laneColors: ['#10b981', '#06b6d4', '#f59e0b', '#34d399'], hitLine: '#10b981', bg: '#064e3b' }
        };

        const LANES_COUNT = 4;
        const KEYS = ['KeyZ', 'KeyX', 'KeyC', 'KeyV'];
        const LANE_NAMES = ['Z', 'X', 'C', 'V'];
        const HIT_WINDOW = 0.15; 

        let levelNotes = []; 
        let particles = [];
        const MAX_PARTICLES = 12; // Жесткое ограничение для 60 FPS на мобильных
        let activeHoldStart = [null, null, null, null];
        let lanePressed = [false, false, false, false];

        let audioCtx = null;
        let isSynthPlaying = false;
        let synthStartTime = 0;

        // Прямые ссылки на репозиторий GitHub для загрузки официальных уровней
        const GITHUB_RAW_BASE = "https://raw.githubusercontent.com/pavel/rhythm-studio-levels/main/";
        const OFFICIAL_LEVELS = [
            { id: 1, title: "Velvet Horizons", bpm: 115, timeSig: "4/4", difficulty: "Easy", file: "velvet_horizons.rs" },
            { id: 2, title: "Triple Pulse", bpm: 135, timeSig: "3/4", difficulty: "Medium", file: "triple_pulse.rs" },
            { id: 3, title: "GitHub Rush", bpm: 160, timeSig: "4/4", difficulty: "Hard", file: "github_rush.rs" }
        ];

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSFX(type) {
            initAudioContext();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            if (type === 'tick') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            } else if (type === 'perfect') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1046.50, now);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            } else if (type === 'miss') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120, now);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
            }

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.15);
        }

        // ВЫРАВНИВАНИЕ / КВАНТОВАНИЕ НОТ ПО BPM
        function snapToGrid(time, bpm, quantizeSubdivision) {
            const beatDuration = 60 / bpm;
            const stepDuration = beatDuration / (quantizeSubdivision / 4);
            return Math.round(time / stepDuration) * stepDuration;
        }

        // РЕНДЕР СПИСКА ОФИЦИАЛЬНЫХ УРОВНЕЙ С GITHUB
        function renderOfficialLevels() {
            const container = document.getElementById('official-levels-list');
            container.innerHTML = '';
            OFFICIAL_LEVELS.forEach(lvl => {
                const diffClass = `badge-${lvl.difficulty.toLowerCase()}`;
                const card = document.createElement('div');
                card.className = 'level-card';
                card.innerHTML = `
                    <div class="level-info">
                        <h4>${lvl.title}</h4>
                        <div class="level-badges">
                            <span class="badge ${diffClass}">${lvl.difficulty}</span>
                            <span class="badge badge-info">${lvl.bpm} BPM</span>
                            <span class="badge badge-info">${lvl.timeSig}</span>
                        </div>
                    </div>
                    <button class="btn btn-small" onclick="loadAndPlayOfficial('${lvl.file}', ${lvl.bpm}, '${lvl.timeSig}')">Играть</button>
                `;
                container.appendChild(card);
            });
        }
        renderOfficialLevels();

        // ПОДГРУЗКА УРОВНЕЙ С GITHUB
        window.loadAndPlayOfficial = async function(fileName, defaultBpm, defaultSig) {
            const url = GITHUB_RAW_BASE + fileName;
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("Файл не найден на GitHub");
                const data = await response.json();
                loadPackageData(data);
            } catch (err) {
                // Если нет сети или файл ещё не выложен — генерируем демо-уровень
                console.warn("Ошибка загрузки с GitHub, переход на демо-генерацию:", err.message);
                generateDemoLevel(defaultBpm, defaultSig);
            }
            startSessionWithCountdown('play');
        };

        function generateDemoLevel(bpm, sig) {
            currentBpm = bpm;
            currentTimeSig = sig;
            levelNotes = [];
            const secPerBeat = 60 / bpm;
            const beatsPerMeasure = sig === '3/4' ? 3 : 4;
            
            for (let b = 2; b < 60; b++) {
                const time = b * secPerBeat;
                const lane = b % 4;
                levelNotes.push({
                    time: parseFloat(time.toFixed(3)),
                    lane: lane,
                    duration: (b % (beatsPerMeasure * 2) === 0) ? parseFloat((secPerBeat * 1.5).toFixed(3)) : 0
                });
            }
            audioPlayer.src = ""; // Используется процедурный синтезатор
        }

        // РАБОТА С ЕДИНЫМ ПАКЕТОМ УРОВНЯ (.RS)
        function loadPackageData(data) {
            if (data.bpm) currentBpm = data.bpm;
            if (data.timeSignature) currentTimeSig = data.timeSignature;
            if (data.notes) levelNotes = data.notes.map(n => ({ ...n, hit: false, missed: false }));

            if (data.audioData) {
                audioPlayer.src = data.audioData;
            } else {
                audioPlayer.src = "";
            }
        }

        // ОБРАБОТЧИК ЗАГРУЗКИ ФАЙЛА .RS В ВКЛАДКЕ
        document.getElementById('play-package-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const data = JSON.parse(event.target.result);
                    loadPackageData(data);
                    alert(`Уровень "${data.title || 'Custom'}" успешно загружен!`);
                } catch (err) { alert('Ошибка чтения файла .rs пакета!'); }
            };
            reader.readAsText(file);
        });

        document.getElementById('start-custom-play-btn').addEventListener('click', () => {
            if (levelNotes.length === 0) {
                alert('Сначала выберите файл уровня (.rs)!');
                return;
            }
            startSessionWithCountdown('play');
        });

        // ЭКСПОРТ ЕДИНОГО ПАКЕТА .RS ИЗ РЕДАКТОРА
        document.getElementById('export-btn').addEventListener('click', async () => {
            const title = document.getElementById('edit-title').value || 'My Level';
            const quantizeVal = parseInt(document.getElementById('edit-quantize').value) || 8;
            
            // Выравниваем все ноты строго по сетке BPM при экспорте
            levelNotes.forEach(n => {
                n.time = snapToGrid(n.time, currentBpm, quantizeVal);
            });
            levelNotes.sort((a, b) => a.time - b.time);

            let audioDataStr = "";
            const audioInput = document.getElementById('edit-audio-input');

            if (audioInput.files && audioInput.files[0]) {
                audioDataStr = await new Promise((resolve) => {
                    const r = new FileReader();
                    r.onload = e => resolve(e.target.result);
                    r.readAsDataURL(audioInput.files[0]);
                });
            } else if (audioPlayer.src && audioPlayer.src.startsWith('data:')) {
                audioDataStr = audioPlayer.src;
            }

            const packageObj = {
                title: title,
                bpm: currentBpm,
                timeSignature: currentTimeSig,
                notes: levelNotes,
                audioData: audioDataStr
            };

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(packageObj, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `${title.toLowerCase().replace(/\s+/g, '_')}.rs`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        });

        // ОБРАТНЫЙ ОТСЧЕТ 3-2-1
        function startSessionWithCountdown(mode) {
            initAudioContext();
            document.getElementById('ui-panel').style.display = 'none';

            const countdownOverlay = document.getElementById('countdown-overlay');
            const countdownNum = document.getElementById('countdown-number');
            countdownOverlay.style.display = 'flex';

            let count = 3;
            countdownNum.textContent = count;
            playSFX('tick');

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownNum.textContent = count;
                    playSFX('tick');
                } else if (count === 0) {
                    countdownNum.textContent = 'GO!';
                    playSFX('perfect');
                } else {
                    clearInterval(timer);
                    countdownOverlay.style.display = 'none';
                    startSession(mode);
                }
            }, 750);
        }

        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function switchTab(mode) {
            currentMode = mode;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            const tabs = ['official', 'custom', 'editor', 'style'];
            const idx = tabs.indexOf(mode);
            document.querySelectorAll('.tab-btn')[idx].classList.add('active');
            document.getElementById(`tab-${mode}`).classList.add('active');
        }

        document.getElementById('theme-select').addEventListener('change', (e) => {
            currentTheme = e.target.value;
            document.documentElement.setAttribute('data-theme', currentTheme);
        });

        function startSynthAudio() {
            stopSynthAudio();
            initAudioContext();
            synthStartTime = audioCtx.currentTime;
            isSynthPlaying = true;
            playSynthLoop();
        }

        function stopSynthAudio() { isSynthPlaying = false; }

        function playSynthLoop() {
            if (!isSynthPlaying || !audioCtx) return;
            const now = audioCtx.currentTime - synthStartTime;
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            
            const freqs = [261.63, 329.63, 392.00, 523.25];
            osc.frequency.setValueAtTime(freqs[Math.floor(now * 4) % 4], audioCtx.currentTime);

            gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);

            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);

            setTimeout(playSynthLoop, (60 / currentBpm) * 500);
        }

        function getCurrentGameTime() {
            if (isSynthPlaying && audioCtx) return audioCtx.currentTime - synthStartTime;
            return audioPlayer.currentTime;
        }

        document.getElementById('start-editor-btn').addEventListener('click', () => {
            currentBpm = parseInt(document.getElementById('edit-bpm').value) || 120;
            currentTimeSig = document.getElementById('edit-timesig').value || '4/4';
            
            const fileInput = document.getElementById('edit-audio-input');
            if (fileInput.files && fileInput.files[0]) {
                audioPlayer.src = URL.createObjectURL(fileInput.files[0]);
            }
            startSessionWithCountdown('editor');
        });

        const recBtn = document.getElementById('rec-btn');
        recBtn.addEventListener('click', () => {
            initAudioContext();
            if (audioPlayer.src) {
                if (audioPlayer.paused) {
                    audioPlayer.play();
                    recBtn.textContent = 'Пауза';
                    recBtn.classList.add('recording');
                } else {
                    audioPlayer.pause();
                    recBtn.textContent = 'Запись';
                    recBtn.classList.remove('recording');
                }
            } else {
                if (!isSynthPlaying) {
                    startSynthAudio();
                    recBtn.textContent = 'Пауза';
                    recBtn.classList.add('recording');
                } else {
                    stopSynthAudio();
                    recBtn.textContent = 'Запись';
                    recBtn.classList.remove('recording');
                }
            }
        });

        document.getElementById('clear-btn').addEventListener('click', () => {
            if (confirm('Очистить все ноты?')) {
                levelNotes = [];
                document.getElementById('score-val').textContent = '0';
            }
        });

        document.getElementById('exit-btn').addEventListener('click', () => {
            stopSynthAudio();
            audioPlayer.pause();
            isRunning = false;
            document.getElementById('ui-panel').style.display = 'flex';
            document.getElementById('editor-controls').style.display = 'none';
            document.getElementById('hud').style.display = 'none';
            document.getElementById('exit-btn').style.display = 'none';
        });

        function startSession(mode) {
            initAudioContext();
            document.getElementById('hud').style.display = 'block';
            document.getElementById('exit-btn').style.display = 'block';

            if (mode === 'editor') {
                document.getElementById('editor-controls').style.display = 'flex';
                document.getElementById('hud-title').textContent = 'Ноты:';
                document.getElementById('combo-box').style.display = 'none';
                document.getElementById('score-val').textContent = levelNotes.length;
            } else {
                document.getElementById('editor-controls').style.display = 'none';
                document.getElementById('hud-title').textContent = 'Счет:';
                document.getElementById('combo-box').style.display = 'block';
                score = 0; combo = 0; updateHUD();
                if (audioPlayer.src) audioPlayer.play();
                else startSynthAudio();
            }

            isRunning = true;
            requestAnimationFrame(gameLoop);
        }

        // ОБПТИМИЗИРОВАННЫЙ ЦИКЛ ОТРЕСОВКИ РЕНДЕРА (60 FPS)
        function gameLoop() {
            if (!isRunning) return;

            const currentTime = getCurrentGameTime();
            const themeCfg = THEMES_CONFIG[currentTheme];

            // Быстрая заливка фона без очистки через прозрачность
            ctx.fillStyle = themeCfg.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const laneWidth = canvas.width / LANES_COUNT;
            const hitLineY = canvas.height * 0.82;
            const scrollDuration = (140 / currentBpm) * 1.2;
            const laneColors = themeCfg.laneColors;

            // Отрисовка дорожек и нажатий
            for (let i = 0; i < LANES_COUNT; i++) {
                ctx.strokeStyle = currentTheme === 'flat-light' ? '#e2e8f0' : '#1e293b';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(i * laneWidth, 0);
                ctx.lineTo(i * laneWidth, canvas.height);
                ctx.stroke();

                if (lanePressed[i]) {
                    ctx.fillStyle = laneColors[i] + '44';
                    ctx.fillRect(i * laneWidth, 0, laneWidth, canvas.height);
                }

                ctx.fillStyle = lanePressed[i] ? laneColors[i] : (currentTheme === 'flat-light' ? '#64748b' : '#94a3b8');
                ctx.font = '800 16px Inter';
                ctx.textAlign = 'center';
                ctx.fillText(LANE_NAMES[i], i * laneWidth + laneWidth / 2, hitLineY + 36);
            }

            // Отрисовка тактовых линий по BPM и Размеру (3/4 или 4/4)
            const beatsPerMeasure = currentTimeSig === '3/4' ? 3 : 4;
            const secPerBeat = 60 / currentBpm;
            const startBeat = Math.floor((currentTime - scrollDuration) / secPerBeat);
            const endBeat = Math.ceil((currentTime + scrollDuration) / secPerBeat);

            ctx.lineWidth = 1;
            for (let b = startBeat; b <= endBeat; b++) {
                const beatTime = b * secPerBeat;
                const timeDiff = beatTime - currentTime;
                const y = hitLineY - (timeDiff / scrollDuration) * hitLineY;

                if (y >= 0 && y <= canvas.height) {
                    const isMeasureStart = (b % beatsPerMeasure) === 0;
                    ctx.strokeStyle = isMeasureStart ? 'rgba(245, 158, 11, 0.6)' : 'rgba(148, 163, 184, 0.15)';
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }
            }

            // Линия удара
            ctx.strokeStyle = themeCfg.hitLine;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, hitLineY);
            ctx.lineTo(canvas.width, hitLineY);
            ctx.stroke();

            // Отрисовка нот
            levelNotes.forEach(note => {
                const timeDiff = note.time - currentTime;
                const dur = note.duration || 0;

                if (currentMode !== 'editor') {
                    if (timeDiff + dur < -HIT_WINDOW && !note.missed && !note.hit) {
                        note.missed = true;
                        combo = 0;
                        updateHUD();
                        showFeedback('MISS', '#ef4444');
                        playSFX('miss');
                    }

                    if (note.holding) {
                        spawnParticles(note.lane * laneWidth + laneWidth / 2, hitLineY, laneColors[note.lane]);
                        score += 2;
                        updateHUD();

                        if (currentTime >= note.time + note.duration) {
                            note.holding = false;
                            note.hit = true;
                            score += 200;
                            combo++;
                            updateHUD();
                            showFeedback('PERFECT', '#10b981');
                            playSFX('perfect');
                        }
                    }
                }

                if (currentMode !== 'editor' && note.hit) return;

                if (timeDiff <= scrollDuration && (timeDiff + dur) >= -HIT_WINDOW) {
                    const yHead = hitLineY - (timeDiff / scrollDuration) * hitLineY;

                    if (dur > 0) {
                        const yTail = hitLineY - ((timeDiff + dur) / scrollDuration) * hitLineY;
                        drawHoldNote(note.lane * laneWidth, yHead, yTail, laneWidth, laneColors[note.lane]);
                    } else {
                        drawFlatNote(note.lane * laneWidth, yHead, laneWidth, laneColors[note.lane]);
                    }
                }
            });

            updateAndDrawParticles();
            requestAnimationFrame(gameLoop);
        }

        function drawFlatNote(x, y, laneWidth, color) {
            const padding = 8;
            const w = laneWidth - padding * 2;
            ctx.fillStyle = color;
            ctx.fillRect(x + padding, y - 8, w, 16);
        }

        function drawHoldNote(x, yHead, yTail, laneWidth, color) {
            const padding = 12;
            const width = laneWidth - padding * 2;
            ctx.fillStyle = color + '55';
            ctx.fillRect(x + padding, yTail, width, yHead - yTail);
            drawFlatNote(x, yHead, laneWidth, color);
        }

        function spawnParticles(x, y, color) {
            if (particles.length > MAX_PARTICLES) return;
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 3,
                vy: (Math.random() - 0.5) * 3,
                color: color,
                size: 3,
                alpha: 1
            });
        }

        function updateAndDrawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy; p.alpha -= 0.08;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            }
        }

        function handlePressStart(laneIndex) {
            if (!isRunning) return;
            lanePressed[laneIndex] = true;
            const currentTime = getCurrentGameTime();

            if (currentMode === 'editor') {
                const quantizeVal = parseInt(document.getElementById('edit-quantize').value) || 8;
                // Привязываем время нажатия строго по сетке BPM
                const snappedTime = snapToGrid(currentTime, currentBpm, quantizeVal);

                levelNotes.push({
                    time: parseFloat(snappedTime.toFixed(3)),
                    duration: 0,
                    lane: laneIndex
                });

                document.getElementById('score-val').textContent = levelNotes.length;
                showFeedback('TAP', '#10b981');
                playSFX('perfect');
            } else {
                const targetNote = levelNotes.find(n => 
                    n.lane === laneIndex && 
                    !n.hit && 
                    !n.missed && 
                    Math.abs(n.time - currentTime) <= HIT_WINDOW
                );

                if (targetNote) {
                    const diff = Math.abs(targetNote.time - currentTime);

                    if (targetNote.duration > 0) {
                        targetNote.holding = true;
                        showFeedback('HOLD', THEMES_CONFIG[currentTheme].laneColors[laneIndex]);
                    } else {
                        targetNote.hit = true;
                        if (diff < 0.06) { 
                            score += 300; combo++; 
                            showFeedback('PERFECT', '#10b981'); 
                            playSFX('perfect'); 
                        } else { 
                            score += 100; combo++; 
                            showFeedback('GOOD', '#f59e0b'); 
                            playSFX('perfect'); 
                        }
                        updateHUD();
                    }
                } else {
                    playSFX('miss');
                }
            }
        }

        function handlePressEnd(laneIndex) {
            if (!isRunning) return;
            lanePressed[laneIndex] = false;
        }

        function showFeedback(text, color) {
            hitFeedback.textContent = text;
            hitFeedback.style.color = color;
            hitFeedback.style.opacity = '1';
            setTimeout(() => { hitFeedback.style.opacity = '0'; }, 120);
        }

        function updateHUD() {
            document.getElementById('score-val').textContent = score;
            document.getElementById('combo-val').textContent = combo;
        }

        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            const laneIndex = KEYS.indexOf(e.code);
            if (laneIndex !== -1) handlePressStart(laneIndex);
        });

        window.addEventListener('keyup', (e) => {
            const laneIndex = KEYS.indexOf(e.code);
            if (laneIndex !== -1) handlePressEnd(laneIndex);
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const laneWidth = rect.width / LANES_COUNT;

            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                const laneIndex = Math.floor((touch.clientX - rect.left) / laneWidth);
                if (laneIndex >= 0 && laneIndex < LANES_COUNT) handlePressStart(laneIndex);
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const laneWidth = rect.width / LANES_COUNT;

            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                const laneIndex = Math.floor((touch.clientX - rect.left) / laneWidth);
                if (laneIndex >= 0 && laneIndex < LANES_COUNT) handlePressEnd(laneIndex);
            }
        }, { passive: false });
    </script>
</body>
